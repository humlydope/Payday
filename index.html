<style>
  :root{
    --bg:#050B0D; --surface:#0E1A1D; --surface2:#152528; --line:#22383D;
    --text:#E9F1EF; --dim:#8AA5A3; --teal:#3FD0AE; --rose:#FF6B5E; --sand:#E8B15C;
    --mono: ui-monospace, "Roboto Mono", SFMono-Regular, Menlo, monospace;
    --sans: system-ui, "Roboto", -apple-system, "Segoe UI", sans-serif;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);
    font-size:16px; overscroll-behavior-y:contain;}
  body{padding-bottom:calc(76px + var(--safe-b));
    padding-top:var(--safe-t);
    padding-left:var(--safe-l); padding-right:var(--safe-r);}
  button,input,select{font-family:inherit;font-size:16px;color:inherit;}
  button{background:none;border:0;padding:0;cursor:pointer;}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px;}

  header{padding:22px 0 10px;}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--dim);
    text-transform:uppercase;}
  h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 0;}

  /* stat tiles */
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;}
  .stat .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--dim);
    text-transform:uppercase;}
  .stat .val{font-family:var(--mono);font-size:23px;font-weight:600;margin-top:5px;line-height:1;}
  .stat .sub{font-size:11px;color:var(--dim);margin-top:5px;line-height:1.3;}
  .teal{color:var(--teal)} .rose{color:var(--rose)} .sand{color:var(--sand)} .dim{color:var(--dim)}

  /* collapsible setup */
  details.setup{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:0 14px;margin-bottom:16px;}
  details.setup summary{list-style:none;padding:14px 0;font-size:14px;font-weight:600;
    display:flex;justify-content:space-between;align-items:center;}
  details.setup summary::-webkit-details-marker{display:none}
  details.setup summary::after{content:"▾";color:var(--dim);font-size:14px;}
  details.setup[open] summary::after{content:"▴"}
  .setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:11px 0;border-top:1px solid var(--line);}
  .setrow label{font-size:14px;color:var(--dim);flex:1;}
  .setrow input{width:118px;}

  input[type=number],input[type=text],input[type=date],select{
    background:var(--surface2);border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;width:100%;outline:none;font-family:var(--mono);color:var(--text);
    min-height:46px;}
  input[type=text]{font-family:var(--sans)}
  select{font-family:var(--sans);appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
  input:focus,select:focus{border-color:var(--teal)}

  /* week cards */
  .wk{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    margin-bottom:8px;overflow:hidden;display:flex;}
  .rail{width:3px;flex:0 0 3px;background:#2A4348;}
  .wk.pay .rail{width:7px;flex:0 0 7px;background:var(--teal);}
  .wk.low .rail{background:var(--rose)}
  .wk-in{flex:1;min-width:0;}
  .wk-head{width:100%;display:flex;justify-content:space-between;align-items:flex-start;
    padding:14px 14px 12px;text-align:left;}
  .wk-date{font-family:var(--mono);font-size:15px;font-weight:700;}
  .tag{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--dim);
    display:block;margin-top:3px;}
  .wk-amt{font-family:var(--mono);font-size:19px;font-weight:700;text-align:right;line-height:1;}
  .wk-amt small{display:block;font-family:var(--mono);font-size:9px;font-weight:400;
    color:var(--dim);margin-top:4px;letter-spacing:.05em;}
  .bar{height:3px;background:#1B2E32;margin:0 14px;border-radius:2px;overflow:hidden;}
  .bar i{display:block;height:100%;background:var(--teal);border-radius:2px;
    transition:width .25s ease;}
  .bar.low i{background:var(--rose)}
  .wk-body{padding:12px 14px 14px;}
  .ln{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:5px 0;}
  .ln .nm{font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ln .dt{font-family:var(--mono);font-size:10px;color:var(--dim);margin-left:6px;}
  .ln .amt{font-family:var(--mono);font-size:14px;white-space:nowrap;}
  .divider{height:1px;background:var(--line);margin:9px 0;}
  .warn{font-family:var(--mono);font-size:11px;color:var(--rose);margin-top:10px;line-height:1.4;}
  .action{background:var(--surface2);border-radius:10px;padding:10px 12px;margin-top:12px;
    font-size:13px;line-height:1.45;}
  .action b{color:var(--sand)}

  /* list cards */
  .sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 4px;}
  .sec-h h2{font-size:17px;font-weight:700;margin:0;}
  .sec-note{font-size:12.5px;color:var(--dim);line-height:1.45;margin:0 0 12px;}
  .card{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:14px;margin-bottom:8px;text-align:left;min-height:62px;}
  .card:active{background:var(--surface2)}
  .card .nm{font-size:15px;font-weight:600;display:block;}
  .card .meta{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:4px;display:block;}
  .card .amt{font-family:var(--mono);font-size:16px;white-space:nowrap;}
  .add{width:100%;border:1px dashed var(--line);border-radius:12px;padding:15px;
    color:var(--teal);font-family:var(--mono);font-size:13px;letter-spacing:.05em;}
  .add:active{background:var(--surface)}
  .empty{border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;
    color:var(--dim);font-size:13px;margin-bottom:8px;}
  .note{font-size:12px;color:var(--dim);line-height:1.5;margin:16px 0 0;}
  .ghost{border:1px solid var(--line);border-radius:10px;padding:12px 16px;
    font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:10px;width:100%;}

  /* bottom nav */
  nav{position:fixed;left:0;right:0;bottom:0;background:rgba(5,11,13,.94);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding-bottom:var(--safe-b);padding-left:var(--safe-l);padding-right:var(--safe-r);z-index:40;}
  .navin{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);}
  nav button{padding:11px 1px 12px;color:var(--dim);font-size:9.5px;letter-spacing:0;
    display:flex;flex-direction:column;align-items:center;gap:4px;}
  nav button .ic{font-size:17px;line-height:1}
  nav button.on{color:var(--teal)}

  .hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .info{width:40px;height:40px;flex:0 0 40px;border-radius:50%;
    border:1px solid var(--line);color:var(--dim);font-family:var(--mono);
    font-size:17px;font-weight:700;line-height:1;display:flex;align-items:center;
    justify-content:center;background:var(--surface);}
  .info:active{border-color:var(--teal);color:var(--teal);}
  .help h4{margin:18px 0 6px;font-size:14.5px;color:var(--teal);}
  .help h4:first-of-type{margin-top:6px}
  .help p{margin:0 0 4px;font-size:13.5px;line-height:1.55;color:var(--text);}
  .help p.sub{color:var(--dim);font-size:12.5px;}

  /* spending */
  .quick{background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:15px 16px;margin:14px 0 18px;}
  .qrow{display:flex;align-items:center;gap:4px;margin:6px 0 12px;}
  .qrow .cur{font-family:var(--mono);font-size:26px;color:var(--dim);}
  .qrow input{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--text);
    background:none;border:0;padding:4px 0;min-height:0;flex:1;width:100%;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .chip{border:1px solid var(--line);border-radius:20px;padding:8px 13px;font-size:12.5px;
    color:var(--dim);background:var(--surface2);}
  .chip.on{color:#04211B;font-weight:700;}
  .day{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--dim);
    text-transform:uppercase;margin:18px 0 7px;display:flex;justify-content:space-between;}
  .ent{display:flex;align-items:center;gap:11px;background:var(--surface);
    border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:6px;}
  .ent .swatch{width:9px;height:9px;border-radius:50%;flex:0 0 9px;}
  .ent .eb{flex:1;min-width:0;}
  .ent .eb b{font-size:14px;font-weight:600;display:block;}
  .ent .eb span{font-size:11.5px;color:var(--dim);}
  .ent .ea{font-family:var(--mono);font-size:14.5px;white-space:nowrap;}
  .ent .x{color:var(--dim);font-family:var(--mono);font-size:17px;padding:0 2px 0 6px;}
  .seg{display:flex;gap:6px;margin:16px 0 4px;}
  .seg button{flex:1;border:1px solid var(--line);border-radius:9px;padding:9px 4px;
    font-size:12px;color:var(--dim);background:var(--surface);}
  .seg button.on{border-color:var(--teal);color:var(--teal);background:var(--surface2);}
  .donutwrap{display:flex;justify-content:center;padding:12px 0 4px;}
  .lg{display:flex;align-items:center;gap:10px;padding:8px 2px;
    border-bottom:1px solid var(--line);}
  .lg .swatch{width:10px;height:10px;border-radius:3px;flex:0 0 10px;}
  .lg .nm{flex:1;font-size:14px;}
  .lg .pc{font-family:var(--mono);font-size:11px;color:var(--dim);width:42px;text-align:right;}
  .lg .amt{font-family:var(--mono);font-size:14px;width:80px;text-align:right;}
  .cut{background:var(--surface2);border-radius:13px;padding:15px;margin-top:18px;
    font-size:13.5px;line-height:1.55;}
  .cut h4{margin:0 0 10px;font-size:14px;}
  .cut .item{padding:10px 0;border-top:1px solid var(--line);}
  .cut b{color:var(--sand)}

  .parkhead{display:flex;align-items:center;justify-content:space-between;width:100%;
    padding:2px 0 4px;text-align:left;}
  .parkchev{color:var(--dim);font-size:13px;font-family:var(--mono);}

  .ln .src{font-size:10.5px;color:var(--dim);display:block;margin-top:2px;
    font-family:var(--mono);letter-spacing:.02em;}
  .ln.done .nm{color:var(--dim);}

  .askrow{background:var(--surface2);border-radius:9px;padding:9px 11px;margin:4px 0 8px;
    font-size:12px;color:var(--dim);line-height:1.6;}
  .askrow button{display:block;width:100%;border:1px solid var(--line);border-radius:8px;
    padding:10px 12px;margin-top:7px;font-size:12.5px;color:var(--teal);text-align:left;}

  .marks{display:flex;gap:7px;margin:2px 0 10px;}
  .marks button{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 6px;
    font-size:12px;color:var(--dim);background:var(--surface);}
  .marks button.on{border-color:var(--teal);color:var(--teal);background:var(--surface2);}

  .potrow{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;}
  .potrow .nm{font-size:14px;}
  .potrow .amt{font-family:var(--mono);font-size:19px;font-weight:700;}

  /* money in hand */
  .hand{background:var(--surface);border:1px solid var(--teal);border-radius:16px;
    padding:15px 16px 14px;margin:14px 0;}
  .hand.stale{border-color:var(--sand)}
  .hand .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--dim);
    text-transform:uppercase;}
  .handrow{display:flex;align-items:center;gap:4px;margin:8px 0 2px;}
  .handrow .cur{font-family:var(--mono);font-size:26px;color:var(--dim);}
  .handrow input{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--teal);
    background:none;border:0;padding:4px 0;min-height:0;flex:1;width:100%;}
  .handrow input:focus{border:0;outline:none;}
  .handnote{font-size:11.5px;color:var(--dim);line-height:1.5;margin-top:6px;}
  .handnote b{color:var(--text);font-weight:600;}
  .hand.stale .handnote b{color:var(--sand)}
  .wk.part .rail{background:var(--sand);width:4px;flex:0 0 4px;}

  /* fit it in */
  .verdict{width:100%;display:flex;align-items:center;gap:11px;padding:12px 13px;
    background:var(--surface);border:1px solid var(--line);border-radius:11px;
    margin-bottom:6px;text-align:left;min-height:56px;}
  .verdict.sel{border-color:var(--teal);background:var(--surface2);}
  .verdict .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;}
  .dot.ok{background:var(--teal)} .dot.tight{background:var(--sand)}
  .dot.no{background:var(--rose)} .dot.late{background:#31474C}
  .verdict .wd{flex:1;min-width:0;}
  .verdict .wd b{font-family:var(--mono);font-size:14px;font-weight:700;display:block;}
  .verdict .wd span{font-size:11.5px;color:var(--dim);}
  .verdict .rt{font-family:var(--mono);font-size:13px;white-space:nowrap;}
  .verdict.dead{opacity:.45}
  .result{background:var(--surface2);border-radius:13px;padding:15px;margin:16px 0 6px;
    line-height:1.5;font-size:14px;}
  .result .big{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--teal);
    display:block;margin-bottom:6px;}
  .result.bad .big{color:var(--rose)}
  .legend{font-size:11.5px;color:var(--dim);line-height:1.6;margin:10px 0 18px;}

  /* sheet */
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;opacity:0;
    pointer-events:none;transition:opacity .2s;}
  .backdrop.on{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);
    border-top:1px solid var(--line);border-radius:20px 20px 0 0;
    padding:8px 16px calc(20px + var(--safe-b));transform:translateY(102%);
    transition:transform .26s cubic-bezier(.32,.72,0,1);max-height:92vh;max-height:92dvh;overflow-y:auto;
    max-width:560px;margin:0 auto;}
  .sheet.on{transform:translateY(0)}
  .grab{width:44px;height:5px;background:var(--line);border-radius:3px;margin:0 auto 14px;
    box-sizing:content-box;padding:12px 60px;background-clip:content-box;}
  .sheet h3{margin:0 0 16px;font-size:18px;}
  .fl{margin-bottom:14px;}
  .fl label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    color:var(--dim);text-transform:uppercase;margin-bottom:6px;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .sheet-actions{display:flex;gap:10px;margin-top:20px;}
  .btn{flex:1;border-radius:12px;padding:15px;font-weight:700;font-size:15px;text-align:center;}
  .btn.save{background:var(--teal);color:#04211B;}
  .btn.del{border:1px solid var(--rose);color:var(--rose);flex:0 0 90px;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const VERSION="6.0 Beta";
/* ── storage: works inside Claude and as a hosted app ── */
const store = {
  async get(k){
    try{ if(window.storage){ const r = await window.storage.get(k); return r ? r.value : null; } }catch(e){}
    try{ return localStorage.getItem(k); }catch(e){ return null; }
  },
  async set(k,v){
    try{ if(window.storage){ await window.storage.set(k,v); return; } }catch(e){}
    try{ localStorage.setItem(k,v); }catch(e){}
  }
};

/* ── dates ── */
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const makeDate=(y,m,day)=>{const dim=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(day,dim));};
const parseISO=s=>{if(!s)return null;const p=s.split("-").map(Number);
  if(p.length!==3||p.some(isNaN))return null;return new Date(p[0],p[1]-1,p[2]);};
const toISO=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const sDate=d=>d.toLocaleDateString("en-NZ",{day:"numeric",month:"short"});
const dayShort=d=>d.toLocaleDateString("en-NZ",{weekday:"short"});
const lDate=d=>d.toLocaleDateString("en-NZ",{day:"numeric",month:"short",year:"numeric"});
const money=n=>(n<0?"-$":"$")+Math.abs(Math.round(n)).toLocaleString("en-NZ");
const uid=()=>Math.random().toString(36).slice(2,9);
const r2=n=>Math.round((Number(n)||0)*100)/100;
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const FREQS=[["weekly","Weekly"],["fortnightly","Fortnightly"],["monthly","Monthly"],
  ["quarterly","Quarterly"],["annual","Yearly"],["once","One-off"]];
const FLBL=Object.fromEntries(FREQS);
const PER_YEAR={weekly:52,fortnightly:26,monthly:12,quarterly:4,annual:1,once:0};

function occurrences(anchorISO,freq,from,to){
  const out=[],anchor=parseISO(anchorISO);
  if(!anchor)return out;
  if(freq==="once"){ if(anchor>=from&&anchor<to)out.push(anchor); return out; }
  if(freq==="weekly"||freq==="fortnightly"){
    const step=freq==="weekly"?7:14; let d=anchor;
    const gap=Math.round((from-d)/86400000);
    if(gap>0)d=addDays(d,Math.floor(gap/step)*step);
    let g=0; while(d<to&&g++<400){ if(d>=from)out.push(d); d=addDays(d,step); }
    return out;
  }
  const stepM=freq==="monthly"?1:freq==="quarterly"?3:12;
  let y=anchor.getFullYear(),m=anchor.getMonth();
  const day=anchor.getDate(); let cur=makeDate(y,m,day),g=0;
  while(cur<from&&g++<800){ m+=stepM; cur=makeDate(y,m,day); }
  g=0;
  while(cur<to&&g++<800){ if(cur>=from)out.push(cur); m+=stepM; cur=makeDate(y,m,day); }
  return out;
}

/* ── data ── */
function nextFriday(){const t=new Date();const d=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  return addDays(d,(5-d.getDay()+7)%7);}
function blank(){
  return {incomes:[],bills:[],debts:[],spend:[],
    settings:{weeks:12,floor:200,extraDebt:0,openingCash:0,strategy:"avalanche",
      weekStart:1,cashUpdated:"",cur:"NZD",fx:{},landed:{},arrived:{},marks:{},
      parkMode:"auto",parkAmount:0,fundStart:0,goalStart:0,aiKeys:{}},
    open:{}};
}
let D=blank(), tab="plan", ready=false;

/* ── profiles ────────────────────────────────────────────
   The first person lives at payday:v1, untouched, so a solo
   user never sees any of this. Extra people get their own key. */
let ROSTER={active:"main", list:[{id:"main",name:"Me",type:"adult"}]};
const KID_TIPS=["#E8B15C","#5EC7F0","#A78BFA","#F08BB4","#A3D977"];
const profKey=id=>id==="main"?"payday:v1":"payday:p:"+id;
const activeProfile=()=>ROSTER.list.find(p=>p.id===ROSTER.active)||ROSTER.list[0];
const isKid=()=>activeProfile().type==="kid";
const multi=()=>ROSTER.list.length>1;

async function loadProfile(id){
  const raw=await store.get(profKey(id));
  const base=blank();
  if(raw){
    try{ const p=JSON.parse(raw);
      if(p&&p.settings){ D=Object.assign(base,p); D.settings=Object.assign(base.settings,p.settings); }
      else D=base;
    }catch(e){ D=base; }
  } else D=base;
}
async function boot(){
  const r=await store.get("payday:roster");
  if(r){ try{ const p=JSON.parse(r); if(p&&p.list&&p.list.length) ROSTER=p; }catch(e){} }
  if(!ROSTER.list.some(p=>p.id===ROSTER.active)) ROSTER.active=ROSTER.list[0].id;
  await loadProfile(ROSTER.active);
  ["openingCash","fundStart","goalStart","parkAmount","floor","extraDebt"].forEach(k=>{
    if(D.settings[k]!==undefined) D.settings[k]=r2(D.settings[k]);
  });
  if(D.settings.marks) Object.keys(D.settings.marks).forEach(k=>{
    D.settings.marks[k].amount=r2(D.settings.marks[k].amount);
  });
  ready=true; render();
}
function saveRoster(){ store.set("payday:roster",JSON.stringify(ROSTER)); }
async function switchProfile(id){
  if(id===ROSTER.active) return;
  clearTimeout(saveT);
  await store.set(profKey(ROSTER.active),JSON.stringify(D));   // flush before leaving
  ROSTER.active=id; saveRoster();
  await loadProfile(id);
  tab="plan"; closeSheet(); render(true);
}
let saveT;
function save(){ if(!ready)return; clearTimeout(saveT);
  saveT=setTimeout(()=>store.set(profKey(ROSTER.active),JSON.stringify(D)),400); }
const tap=()=>{ try{navigator.vibrate&&navigator.vibrate(8);}catch(e){} };

/* ── maths ── */
function buildWeeks(nOverride){
  const t=new Date(), today=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  const ws=(D.settings.weekStart===undefined)?1:+D.settings.weekStart;
  const dow=today.getDay();
  const firstStart = dow===ws ? today : addDays(today,(ws-dow+7)%7);
  const S=D.settings, rows=[], spans=[]; let carry=+S.openingCash||0;
  if(firstStart>today) spans.push([today,firstStart,true]);
  const NW=nOverride||S.weeks;
  for(let i=0;i<NW;i++) spans.push([addDays(firstStart,i*7),addDays(firstStart,(i+1)*7),false]);
  spans.forEach(sp=>{
    const from=sp[0], to=sp[1], part=sp[2], ins=[], outs=[];
    /* income dated on or before your last balance update is already in that
       balance — counting it again would double it */
    const tnow=new Date(); const tday=new Date(tnow.getFullYear(),tnow.getMonth(),tnow.getDate());
    D.incomes.forEach(it=>occurrences(it.anchor,it.freq,from,to).forEach(d=>{
      const key=it.id+"|"+toISO(d);
      const marked=(D.settings.landed||{})[key];
      const isToday=d.getTime()===tday.getTime();
      const past=d<tday;
      const rec=(D.settings.arrived||{})[key];          // what actually landed
      const amt=rec!==undefined ? r2(rec) : (+it.amount||0);
      ins.push({name:it.name, amount:amt, expected:+it.amount||0, date:d, key,
        arrived: rec!==undefined,
        markable: d<=addDays(tday,13),
        banked: rec!==undefined ? true : (marked!==undefined ? !!marked : past)});
    }));
    const MK=D.settings.marks||{};
    const pushOut=(it,d,amt,extra)=>{
      const key=it.id+"|"+toISO(d);
      const m=MK[key]||null;
      const aside=(m&&m.state==="aside")?Math.min(amt,+m.amount||0):0;
      const paid=(m&&m.state==="paid");
      outs.push(Object.assign({name:it.name,amount:amt,date:d,key,mark:m,
        aside, paid, remaining: paid?0:Math.max(0,amt-aside)},extra||{}));
    };
    D.bills.forEach(it=>occurrences(it.anchor,it.freq,from,to).forEach(d=>
      pushOut(it,d,+it.amount||0,{lumpy:it.freq!=="weekly", goal:it.freq==="once"})));
    D.debts.forEach(it=>occurrences(it.anchor,it.freq,from,to).forEach(d=>
      pushOut(Object.assign({},it,{name:it.name+" minimum"}),d,+it.minPayment||0,
        {debt:1, debtId:it.id, lumpy:it.freq!=="weekly"})));
    const extra=+S.extraDebt||0;
    if(extra>0&&D.debts.length&&!part) outs.push({name:"Extra off debt",amount:extra,date:from,debt:1});
    outs.sort((a,b)=>a.date-b.date);
    const totalIn=ins.reduce((a,b)=>a+(b.banked?0:b.amount),0),
          totalOut=outs.reduce((a,b)=>a+b.remaining,0);
    const opening=carry, closing=opening+totalIn-totalOut; carry=closing;
    rows.push({from,to,part,ins,outs,totalIn,totalOut,opening,closing,pay:ins.length>1});
  });
  return rows;
}
function weekName(w){
  const end=addDays(w.to,-1);
  return w.part ? "Now → "+dayShort(end)+" "+sDate(end) : dayShort(w.from)+" "+sDate(w.from);
}
function weekTag(w){
  return w.part ? "REST OF THIS WEEK" : (w.pay?"PAY WEEK":"OFF WEEK");
}
function smoothed(){
  const wk=(arr,key)=>arr.reduce((a,b)=>a+((+b[key]||0)*PER_YEAR[b.freq])/52,0);
  const income=wk(D.incomes,"amount");
  const billsWeekly=D.bills.filter(b=>b.freq==="weekly").reduce((a,b)=>a+(+b.amount||0),0);
  const billsLumpy=wk(D.bills.filter(b=>b.freq!=="weekly"),"amount");
  const debtMin=wk(D.debts,"minPayment"), extra=+D.settings.extraDebt||0;
  return{income,billsWeekly,billsLumpy,debtMin,extra,
    free:income-billsWeekly-billsLumpy-debtMin-extra};
}
function payoff(){
  let ds=D.debts.map(d=>({name:d.name,bal:+d.balance||0,apr:+d.apr||0,
    min:((+d.minPayment||0)*PER_YEAR[d.freq])/12})).filter(d=>d.bal>0);
  if(!ds.length)return null;
  const extraM=((+D.settings.extraDebt||0)*52)/12;
  let interest=0,months=0;
  while(ds.some(d=>d.bal>0)&&months<600){
    months++; let pool=extraM;
    ds.forEach(d=>{ if(d.bal<=0)return;
      const i=(d.bal*d.apr)/100/12; interest+=i; d.bal+=i;
      const p=Math.min(d.bal,d.min); d.bal-=p;
      if(d.bal<=.01){ pool+=d.min-p; d.bal=0; } });
    const live=ds.filter(d=>d.bal>0); if(!live.length)break;
    const target=D.settings.strategy==="snowball"
      ? live.reduce((a,b)=>b.bal<a.bal?b:a) : live.reduce((a,b)=>b.apr>a.apr?b:a);
    const p=Math.min(target.bal,pool); target.bal-=p; if(target.bal<=.01)target.bal=0;
  }
  const end=new Date(); end.setMonth(end.getMonth()+months);
  return{months,interest,end,hit:months>=600};
}

/* ── views ── */
function statTile(lbl,val,cls,sub){
  return '<div class="stat"><div class="lbl">'+lbl+'</div><div class="val '+(cls||"")+'">'+val+
    '</div>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div>';
}
function viewPlan(){
  const W=buildWeeks(), sm=smoothed(), S=D.settings;
  const low=W.reduce((m,w)=>w.closing<m.closing?w:m,W[0]||{closing:0});

  const upd=parseISO(S.cashUpdated);
  const days=upd?Math.round((new Date()-upd)/86400000):null;
  const ago = days===null ? "not set yet"
    : days<=0 ? "updated today" : days===1 ? "updated yesterday"
    : days<8 ? "updated "+days+" days ago"
    : "last updated "+lDate(upd)+" — worth a refresh";

  let h='<div class="hand'+(days!==null&&days>7?" stale":"")+'">'
    +'<div class="lbl">Money I have right now</div>'
    +'<div class="handrow"><span class="cur">$</span>'
    +'<input type="number" inputmode="decimal" data-set="openingCash" value="'
    +r2(+S.openingCash||0)+'"></div>'
    +'<div class="handnote">Bank plus cash in your pocket. Everything below is counted from '
    +'this number. <b>'+ago+'</b></div></div>';

  const FP=fundPlan();
  h+='<div class="stats">'
    +statTile("Income / week",money(sm.income),"","averaged over the cycle")
    +statTile("In the pots",money(FP.potBills+FP.potGoals),"sand",
        "bills float plus goals")
    +statTile("Free to spend",money(sm.free),sm.free<0?"rose":"teal","after every commitment")
    +statTile("Lowest point",money(FP.worstSpend),(FP.worstSpend)<(+S.floor)?"rose":"",
        "your everyday account, weeks ahead")
    +'</div>';

  if(!D.incomes.length && !D.bills.length && !D.debts.length){
    return h+'<div class="cut" style="margin-top:4px">'
      +'<h4>Three things and it starts working</h4>'
      +'<div class="item"><b>1.</b> Put what you have right now in the box above.</div>'
      +'<div class="item"><b>2.</b> On the Bills tab, add what comes in and what goes out. '
      +'Include the yearly and quarterly ones — rates, insurance, rego.</div>'
      +'<div class="item"><b>3.</b> Come back here. You\'ll get a week-by-week plan and a '
      +'figure for what\'s actually free to spend.</div>'
      +'<button class="btn save" data-goto="money" style="width:100%;margin-top:14px">'
      +'Add my income and bills</button></div>';
  }

  h+='<details class="setup"'+(D.open.setup?" open":"")+' id="setupBox"><summary>Your numbers</summary>'
    +'<div class="setrow"><label>Week starts on</label>'
    +'<select data-set="weekStart" style="width:140px">'
    +[[1,"Monday"],[5,"Friday"],[0,"Sunday"],[6,"Saturday"]].map(d=>
      '<option value="'+d[0]+'"'+((+S.weekStart)===d[0]?" selected":"")+'>'+d[1]+'</option>').join("")
    +'</select></div>'
    +setRow("Safety floor","floor",S.floor)
    +setRow("Extra off debt each week","extraDebt",S.extraDebt)
    +setRow("Weeks to show","weeks",S.weeks,1)
    +'<div class="setrow"><label>Your numbers, saved to a file</label></div>'
    +'<div style="display:flex;gap:8px;padding-bottom:12px">'
    +'<button class="ghost" data-backup="1" style="margin:0">Back up</button>'
    +'<button class="ghost" data-restore="1" style="margin:0">Restore</button></div>'
    +'<input type="file" id="restoreFile" accept="application/json,.json" style="display:none">'
    +'<div class="setrow"><label>People using this</label>'
    +'<button class="ghost" data-people="1" style="width:auto;margin:0;padding:9px 14px">'
    +(multi()?ROSTER.list.length+" — switch":"Add someone")+'</button></div>'
    +'<div class="setrow"><label>Version '+VERSION+'</label>'
    +'<button class="ghost" data-update="1" style="width:auto;margin:0;padding:9px 14px">'
    +'Check for update</button></div>'
    +'</details>';

  h+=viewFundCard();

  /* a goal's saving rate is due to step up */
  const t0=new Date(), tday=new Date(t0.getFullYear(),t0.getMonth(),t0.getDate());
  D.bills.filter(b=>b.plan&&b.plan.length>1).forEach(b=>{
    const cur=b.step||0;
    if(cur>=b.plan.length-1) return;
    const nextFrom=parseISO(b.plan[cur+1].from);
    if(!nextFrom||nextFrom>tday) return;
    h+='<div class="cut" style="border:1px solid var(--sand);margin:0 0 16px">'
      +'<h4 style="color:var(--sand)">Time to step up</h4>'
      +'<div class="item" style="border:0;padding-top:0">Your saving for <b>'+esc(b.name)
      +'</b> moves from '+cash(b.plan[cur].perWeek)+' to <b>'+cash(b.plan[cur+1].perWeek)
      +'</b> a week from '+lDate(nextFrom)+'. Change your standing order, then tap below so '
      +'the park amount matches.</div>'
      +'<button class="btn save" data-stepup="'+b.id+'" style="width:100%">'
      +'Done — update my park amount</button></div>';
  });

  h+='<button class="ghost" data-ai="1" style="margin:0 0 16px;color:var(--teal);'
    +'border-color:var(--teal)">Ask an AI about these numbers</button>';

  if(sm.free<0) h+='<div class="empty" style="border-color:var(--rose);color:var(--rose);text-align:left">'
    +'Your commitments run '+money(-sm.free)+' a week ahead of your income. Something has to move '
    +'before the buffer runs out.</div>';

  W.forEach((w,i)=>{
    const lowW=w.closing<(+S.floor);
    const cur=(D.open.week===undefined)?0:D.open.week;
    const open=(cur===i);
    const cap=Math.max(w.totalIn,Math.abs(w.closing),1);
    const pct=Math.max(0,Math.min(100,(w.closing/cap)*100));
    h+='<div class="wk'+(w.pay?" pay":"")+(w.part?" part":"")+(lowW?" low":"")+'" data-idx="'+i+'">'
      +'<div class="rail"></div><div class="wk-in">'
      +'<button class="wk-head" data-week="'+i+'">'
      +'<span><span class="wk-date">'+weekName(w)+'</span>'
      +'<span class="tag">'+weekTag(w)+'</span></span>'
      +'<span class="wk-amt '+(lowW?"rose":"teal")+'">'+money(w.closing)
      +'<small>LEFT AFTER THIS WEEK</small></span></button>'
      +'<div class="bar'+(lowW?" low":"")+'"><i style="width:'+pct+'%"></i></div>';
    if(open){
      h+='<div class="wk-body">';
      h+=line("Carried in",null,w.opening,"dim");
      w.ins.forEach(x=>{
        let src;
        if(x.arrived){
          const diff=r2(x.amount-x.expected);
          src="\u2713 "+cash(x.amount)+" arrived"
            +(diff>0.01?" \u00b7 "+cash(diff)+" more than expected"
             :diff<-0.01?" \u00b7 "+cash(-diff)+" less than expected":"");
        } else src = x.banked ? "\u2713 already in your balance" : "\u2192 into everyday";
        h+=line(x.name,x.date,x.amount, x.banked?"dim":"teal", x.banked?"":"+", src, x.banked);
        if(x.markable)
          h+='<div class="marks">'
            +'<button class="'+(x.arrived?"on":"")+'" data-arrived="'+esc(x.key)
            +'" data-amt="'+x.expected+'">'
            +(x.arrived?"\u2713 Arrived \u00b7 tap to undo":"It arrived")+'</button></div>';
      });
      h+='<div class="divider"></div>';
      if(!w.outs.length) h+='<div class="ln"><span class="nm dim">Nothing due</span></div>';
      const tnow2=new Date(), tday2=new Date(tnow2.getFullYear(),tnow2.getMonth(),tnow2.getDate());
      const soon=addDays(tday2,13);
      w.outs.forEach(x=>{
        const done=x.paid||x.aside>0;
        let src;
        if(x.paid) src="\u2713 paid";
        else if(x.aside>=x.amount-0.01) src="\u2713 set aside, waiting for the due date";
        else if(x.aside>0) src="\u2713 "+cash(x.aside)+" set aside \u00b7 "+cash(x.remaining)+" still to pay";
        else src = x.lumpy ? (x.goal?"\u2190 goals pot, then everyday":"\u2190 bills pot, then everyday")
                           : "\u2190 from everyday";
        h+=line(x.name,x.date,x.amount, done?"dim":(x.debt?"sand":""), done?"":"−", src, done);
        if(x.date<=soon)
          h+='<div class="marks">'
            +'<button class="'+(x.paid?"on":"")+'" data-mark="paid" data-key="'+esc(x.key)
            +'" data-amt="'+x.amount+'"'+(x.debtId?' data-debtid="'+esc(x.debtId)+'"':'')+'>'+(x.paid?"\u2713 Paid":"Paid")+'</button>'
            +'<button class="'+(x.aside>0?"on":"")+'" data-mark="aside" data-key="'+esc(x.key)
            +'" data-amt="'+x.amount+'" data-goal="'+(x.goal?1:0)+'">'
            +(x.aside>0?"\u2713 Set aside":"Put aside")+'</button></div>';
      });
      const sm2=smoothed();
      /* the goals transfer isn't a dated bill, so it needs its own line */
      const gwk=r2(goalWeekly());
      if(gwk>0){
        const gkey="goalpark|"+toISO(w.from);
        const gm=(D.settings.marks||{})[gkey];
        const gdone=!!gm;
        h+='<div class="divider"></div>'
          +line("Set aside for your goals",null,gwk, gdone?"dim":"rose", gdone?"":"−",
            gdone?"\u2713 "+cash(gm.amount)+" set aside"+(gm.amount<gwk-0.01?" \u00b7 "+cash(gwk-gm.amount)+" short of the weekly amount":gm.amount>gwk+0.01?" \u00b7 "+cash(gm.amount-gwk)+" ahead":"")
                 :"\u2192 into the goals account", gdone);
        if(w.from<=addDays(new Date(),13))
          h+='<div class="marks"><button class="'+(gdone?"on":"")+'" data-mark="aside" '
            +'data-key="'+gkey+'" data-amt="'+gwk+'" data-goal="1">'
            +(gdone?"\u2713 Set aside":"Put aside")+'</button></div>';
      }

      const smB=smoothed(); const bwk=r2(smB.billsLumpy+smB.debtMin);
      if(bwk>0){
        const bkey="billpark|"+toISO(w.from);
        const bm=(D.settings.marks||{})[bkey];
        const bdone=!!bm;
        h+=line("Build your bills float",null,bwk, bdone?"dim":"sand", bdone?"":"−",
          bdone?"\u2713 "+cash(bm.amount)+" set aside"
               :"\u2192 optional \u00b7 what these bills cost per week", bdone);
        if(w.from<=addDays(new Date(),13))
          h+='<div class="marks"><button class="'+(bdone?"on":"")+'" data-mark="aside" '
            +'data-key="'+bkey+'" data-amt="'+bwk+'" data-goal="0">'
            +(bdone?"\u2713 Set aside":"Put aside")+'</button></div>';
      }

      const fr=FP.rows[i]||null;
      if(fr){
        const yours=Math.max(0,fr.spend-(+S.floor));
        h+='<div class="action">';
        if(fr.allHandled)
          h+='<div class="item" style="border:0;padding:0 0 10px;color:var(--teal)">'
            +'\u2713 Everything due this week is handled.</div>';
        if(fr.bills.out>0.5||fr.goals.out>0.5||fr.potAfter>0.5||goalWeekly()>0){
          h+='<div class="lbl" style="font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;'
            +'color:var(--dim);text-transform:uppercase;margin-bottom:8px">The pots</div>';
          if(fr.bills.before>0.5||fr.bills.out>0.5)
            h+=ln2("Bills float",fr.bills.before)
              +(fr.bills.out>0.5?ln2("  pays out",fr.bills.out,"\u2212"):"")
              +ln2("  left",fr.bills.after,"","sand");
          if(fr.goals.before>0.5||fr.goals.out>0.5||goalWeekly()>0)
            h+=ln2("Goals account",fr.goals.before)
              +(fr.goals.out>0.5?ln2("  pays out",fr.goals.out,"\u2212"):"")
              +ln2("  left",fr.goals.after,"","rose");
          h+='<div class="divider"></div>';
        }
        h+=ln2("In your everyday account",fr.spend)
          +ln2("Your floor, left sitting there",(+S.floor),"\u2212")
          +ln2("Safe to spend this week",fr.safe,"","teal")
          +(fr.limitedBy!==undefined && fr.limitedBy!==i && FP.rows[fr.limitedBy]
            ? '<p class="note" style="margin:8px 0 0">You have '+cash(yours)
              +' spare this week, but only '+cash(fr.safe)+' of it is really yours \u2014 the rest '
              +'is holding up the week of <b>'+sDate(FP.rows[fr.limitedBy].w.from)+'</b>.</p>'
            : '<p class="note" style="margin:8px 0 0">This is the tightest week ahead, so what is '
              +'spare here is genuinely yours.</p>')
          +'</div>';
      }
      if(lowW) h+='<div class="warn">▲ Below your '+money(+S.floor)
        +' floor. Move a bill or hold back spending the week before.</div>';
      h+='</div>';
    }
    h+='</div></div>';
  });
  return h;
}
function setRow(label,key,val,int){
  return '<div class="setrow"><label>'+label+'</label>'
    +'<input type="number" inputmode="'+(int?"numeric":"decimal")+'" data-set="'+key+'" value="'+val+'"></div>';
}
function ln2(name,amount,sign,cls){
  return '<div class="ln"><span class="nm'+(cls?" "+cls:"")+'">'+name+'</span>'
    +'<span class="amt '+(cls||"")+'">'+(sign||"")+cash(amount)+'</span></div>';
}
function line(name,date,amount,cls,sign,src,done){
  return '<div class="ln'+(done?" done":"")+'"><span class="nm">'+esc(name)
    +(date?'<span class="dt">'+sDate(date)+'</span>':'')
    +(src?'<span class="src">'+src+'</span>':'')+'</span>'
    +'<span class="amt '+(cls||"")+'">'+(sign||"")+cash(amount)+'</span></div>';
}

  const P=payoff(), total=D.debts.reduce((a,b)=>a+(+b.balance||0),0);
  let h='<div class="stats">'
    +statTile("Total owing",money(total),total?"rose":"teal")
    +statTile("Debt free",P?(P.hit?"Not yet":lDate(P.end)):"—",
       "",P&&!P.hit?P.months+" months away":"add an extra payment")
    +'</div>'
    +'<div class="stats" style="grid-template-columns:1fr">'
    +statTile("Interest you'll pay on this plan",P&&!P.hit?money(P.interest):"—","sand")
    +'</div>';
  h+='<details class="setup" open><summary>Payoff plan</summary>'
    +setRow("Extra per week","extraDebt",D.settings.extraDebt)
    +'<div class="setrow"><label>Pay off in what order</label></div>'
    +'<div style="padding-bottom:14px"><select data-set="strategy">'
    +'<option value="avalanche"'+(D.settings.strategy==="avalanche"?" selected":"")+'>Highest interest first</option>'
    +'<option value="snowball"'+(D.settings.strategy==="snowball"?" selected":"")+'>Smallest balance first</option>'
    +'</select></div></details>';
  h+='<div class="sec-h"><h2>What you owe</h2></div>';
  h+=D.debts.length?D.debts.map(d=>'<button class="card" data-edit="debt" data-id="'+d.id+'">'
    +'<span><span class="nm">'+esc(d.name||"Untitled")+'</span>'
    +'<span class="meta">'+(+d.apr||0)+'% · '+money(+d.minPayment||0)+' '+FLBL[d.freq].toLowerCase()+'</span></span>'
    +'<span class="amt rose">'+money(+d.balance||0)+'</span></button>').join("")
    :'<div class="empty">Nothing owing. Add a card or loan to see a payoff date.</div>';
  h+='<button class="add" data-edit="debt" data-id="new">+ Add debt</button>';
  h+='<p class="note">The payoff date assumes you keep paying the minimums plus the extra and add nothing new to the balance. Interest is worked out monthly, so treat it as close, not exact.</p>';
  return h;
}

/* ── fit it in: where does an unplanned payment land ── */
let F={name:"",amount:0,by:"",split:1,scanned:false,pick:null,mode:"save"};

function fitScan(){
  const W=buildWeeks(), floor=+D.settings.floor||0;
  const n=Math.max(1,Math.min(12,+F.split||1)), per=(+F.amount||0)/n;
  const by=parseISO(F.by);
  return W.map((w,i)=>{
    let worst=Infinity;
    for(let j=i;j<W.length;j++){
      worst=Math.min(worst, W[j].closing - per*Math.min(n,j-i+1));
    }
    const lastPay=addDays(w.from,(n-1)*7);
    return {i, from:w.from, last:lastPay, worst, pay:w.pay, part:w.part, label:weekName(w),
      late: by ? lastPay>by : false,
      status: worst>=floor ? "ok" : worst>=0 ? "tight" : "no"};
  });
}
function fitBest(rows){
  return rows.find(r=>!r.late&&r.status==="ok")
      || rows.find(r=>!r.late&&r.status==="tight")
      || null;
}
/* ── how much you really spend, from what you've logged ── */
/* How often each kind of spending typically happens, per week. Used only while
   there's too little history to measure the real rate — a coffee logged once is
   probably a habit; a $200 grocery shop is not a daily event. */
const CAT_PER_WEEK={
  "Groceries":1.5, "Takeaway & coffee":6, "Transport & fuel":2, "Household":0.5,
  "Kids":1, "Health":0.3, "Fun & going out":1, "Clothes":0.25, "Other":1
};
function avgSpend(){
  const list=(D.spend||[]).filter(s=>s.cat!==DEBT_CAT);
  if(!list.length) return {avg:0, days:0, conf:"none", label:"nothing logged yet", enough:false};
  const dates=list.map(s=>parseISO(s.date)).filter(Boolean).sort((a,b)=>a-b);
  const t=new Date(), today=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  const days=Math.max(1,Math.round((today-dates[0])/86400000)+1);

  /* what you've actually spent, per week */
  const window=Math.max(7,Math.min(days,56));
  const from=addDays(today,-(window-1));
  const inWin=list.filter(s=>{const d=parseISO(s.date);return d&&d>=from;});
  const observed=(inWin.reduce((a,b)=>a+(+b.amount||0),0)/window)*7;

  /* what it probably costs a week, judging by the kind of thing it is */
  const byCat={};
  list.forEach(s=>{ const k=s.cat||"Other";
    if(!byCat[k]) byCat[k]={sum:0,count:0};
    byCat[k].sum+=(+s.amount||0); byCat[k].count++; });
  let typical=0;
  Object.keys(byCat).forEach(k=>{
    const perEvent=byCat[k].sum/byCat[k].count;
    typical+=perEvent*(CAT_PER_WEEK[k]!==undefined?CAT_PER_WEEK[k]:1);
  });

  /* lean on the pattern early, on the measurement once there's enough of it */
  const w=Math.min(1,days/21);
  const avg=w*observed+(1-w)*typical;
  const conf = days>=21 ? "solid" : days>=7 ? "getting there" : "rough";
  return {avg, observed, typical, days, conf, enough:days>=21,
    label: conf==="solid" ? "solid — "+days+" days logged"
         : conf==="getting there" ? "getting there — "+days+" days logged"
         : "rough — "+days+(days===1?" day":" days")+" logged, so mostly estimated from the kind of spending it is"};
}

/* ── goal scheduling ─────────────────────────────────────
   Each week has a capacity: the balance that week, less the floor,
   less what you actually spend by then. Savings can never exceed it.
   Back-load against that, then group into monthly steps.          */
function goalSchedule(amount, dueISO){
  const due=parseISO(dueISO); if(!due||amount<=0) return null;
  const t=new Date(), today=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  const totalWeeks=Math.floor((due-today)/(7*86400000));
  if(totalWeeks<2) return {tooSoon:true, weeks:totalWeeks};

  const sp=avgSpend(), floor=+D.settings.floor||0;
  const FP=fundPlan(totalWeeks+2);
  const rows=FP.rows.filter(r=>r.w.from<due);
  if(!rows.length) return null;

  const cap=rows.map(r=>r.spend - floor - sp.avg*r.contribs);
  const n=rows.length;

  /* Weeks that already sit under the floor simply can't carry any saving.
     They contribute nothing and the plan starts after them — not a wall. */
  const dips=rows.filter((r,j)=>cap[j]<-0.5);
  const firstDip=dips.length?dips[0]:null;
  const firstDipShort=firstDip?-cap[rows.indexOf(firstDip)]:0;
  const startWeek=rows.find((r,j)=>cap[j]>=-0.5);

  /* what each week can carry on its own: that week's gain, less living costs */
  const inc=cap.map((c,j)=>Math.max(0, c-(j?cap[j-1]:0)));
  const capacity=inc.reduce((a,b)=>a+b,0);
  const reachable=Math.max(0,Math.min(capacity,cap[n-1]));
  const feasible=reachable>=amount-0.5;

  /* share the target across weeks in proportion to that capacity, never
     letting the running total exceed what the account can actually hold back */
  const c=new Array(n).fill(0);
  if(capacity>0){
    let carry=0, run=0;
    for(let j=0;j<n;j++){
      let want=amount*(inc[j]/capacity)+carry;
      const room=Math.max(0,cap[j]-run);
      const put=Math.min(want,room);
      carry=want-put; run+=put; c[j]=put;
    }
    if(carry>0.5 && feasible){ c[n-1]+=carry; }
  }

  /* weekly contributions, grouped into calendar months */
  const active=cap.map(v=>v>=-0.5);
  const groups=[];
  rows.forEach((r,j)=>{
    if(!active[j]) return;                 // under the floor: nothing goes in
    const key=r.w.from.getFullYear()+"-"+r.w.from.getMonth();
    let g=groups.find(x=>x.key===key);
    if(!g){ g={key, from:r.w.from, weeks:0, total:0, idx:[]}; groups.push(g); }
    g.weeks++; g.total+=c[j]; g.idx.push(j);
  });
  groups.forEach(g=>{ g.perWeek=g.weeks?Math.round((g.total/g.weeks)/5)*5:0; });

  /* merge neighbouring months that land on similar amounts */
  const phases=[];
  groups.forEach(g=>{
    const last=phases[phases.length-1];
    if(last && Math.abs(last.perWeek-g.perWeek)<=10){
      last.weeks+=g.weeks; last.total+=g.total;
      last.perWeek=Math.round((last.total/last.weeks)/5)*5;
    } else phases.push(Object.assign({},g));
  });
  /* rounding must never undershoot — the last phase carries the remainder */
  const scheduled=phases.reduce((a,p)=>a+p.perWeek*p.weeks,0);
  if(phases.length && scheduled<amount){
    const lastP=phases[phases.length-1];
    lastP.perWeek=Math.ceil(((amount-(scheduled-lastP.perWeek*lastP.weeks))/lastP.weeks)/5)*5;
  }

  /* a schedule that dips then climbs is just noise from where paydays fall.
     Try a version that only ever steps up, and keep it if the account can
     carry the higher early weeks without breaking the floor. */
  let levelled=false;
  if(phases.length>1){
    const mono=phases.map(p=>Object.assign({},p));
    let run=0;
    for(let i=0;i<mono.length;i++){ run=Math.max(run,mono[i].perWeek); mono[i].perWeek=run; }
    let ok=true, cum=0;
    const seq=[];
    mono.forEach(p=>{ for(let k=0;k<p.weeks;k++) seq.push(p.perWeek); });
    const activeIdx=cap.map((v,j)=>j).filter(j=>active[j]);
    for(let i=0;i<seq.length && ok;i++){
      cum+=seq[i];
      if(cum>cap[activeIdx[i]]+0.5) ok=false;
    }
    if(ok){
      /* levelling up overshoots — scale back to the target, keep it monotone */
      let mtot=mono.reduce((a,p)=>a+p.perWeek*p.weeks,0);
      if(mtot>amount+5){
        const f=amount/mtot, wks=mono.reduce((a,p)=>a+p.weeks,0);
        mono.forEach(p=>{ p.perWeek=Math.max(0,Math.round((p.perWeek*f)/5)*5); });
        let run2=0; mono.forEach(p=>{ run2=Math.max(run2,p.perWeek); p.perWeek=run2; });
        mtot=mono.reduce((a,p)=>a+p.perWeek*p.weeks,0);
        if(mtot<amount){
          const L=mono[mono.length-1];
          L.perWeek=Math.ceil(((amount-(mtot-L.perWeek*L.weeks))/L.weeks)/5)*5;
        }
      }
      /* collapse neighbours that ended up identical */
      const merged=[];
      mono.forEach(p=>{
        const l=merged[merged.length-1];
        if(l && l.perWeek===p.perWeek){ l.weeks+=p.weeks; l.total+=p.total; }
        else merged.push(p);
      });
      phases.length=0; merged.forEach(p=>phases.push(p));
      levelled=true;
    }
  }

  /* Levelling didn't fit, so the early weeks genuinely can't carry a flat rate.
     Find the best "start low, step up once" plan instead — one standing order
     and one change, which is the most anyone will actually follow. */
  if(!levelled && phases.length>1){
    const starts=[];      // week index at each month boundary
    let seen=null;
    rows.forEach((r,j)=>{
      const k=r.w.from.getFullYear()+"-"+r.w.from.getMonth();
      if(k!==seen){ seen=k; if(j>0) starts.push(j); }
    });
    const flatRate=amount/n;
    let best=null;
    starts.forEach(k=>{
      const w1=k, w2=n-k;
      for(let f=0;f<=8;f++){
        const a=flatRate*(f/8);
        const b=(amount-a*w1)/w2;
        if(b<a) continue;
        let cum=0, ok=true;
        for(let j=0;j<n;j++){ if(!active[j]) continue;
          cum+=(j<k?a:b); if(cum>cap[j]+0.5){ ok=false; break; } }
        if(ok && (!best || b<best.b)) best={k,a,b,w1,w2};
      }
    });
    if(best){
      const rA=Math.max(0,Math.round(best.a/5)*5);
      let rB=Math.ceil(((amount-rA*best.w1)/best.w2)/5)*5;
      if(rB<rA) rB=rA;
      phases.length=0;
      if(rA>0) phases.push({from:rows[0].w.from, weeks:best.w1, total:rA*best.w1, perWeek:rA});
      else phases.push({from:rows[0].w.from, weeks:best.w1, total:0, perWeek:0});
      phases.push({from:rows[best.k].w.from, weeks:best.w2, total:rB*best.w2, perWeek:rB});
    }
  }
  const flat=amount/totalWeeks;
  return {phases, feasible, reachable, amount, due, totalWeeks, flat,
    dips:dips.length, firstDip, firstDipShort, startWeek,
    neverRecovers:!startWeek,
    shortPerWeek:Math.max(0,(amount-reachable)/totalWeeks), sp, tooSoon:false};
}
function goalList(){
  const t=new Date(), today=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  return D.bills.filter(b=>b.freq==="once" && parseISO(b.anchor) && parseISO(b.anchor)>today)
    .map(b=>{
      const d=parseISO(b.anchor);
      const wks=Math.max(1,Math.floor((d-today)/(7*86400000)));
      return {b, due:d, wks, per:(+b.amount||0)/wks};
    })
    .sort((a,b)=>a.due-b.due);
}
function viewFit(){
  const S=D.settings, mode=F.mode||"save";
  let h='<div class="seg" style="margin-top:6px">'
    +'<button class="'+(mode==="save"?"on":"")+'" data-fitmode="save">Saving for a date</button>'

    +'</div>';

  if(mode==="save"){
    h+='<div class="sec-h"><h2>Something coming up</h2></div>'
      +'<p class="sec-note">A trip, a car service, school fees, a tax bill. Tell it what and when, '
      +'and it works out what to put aside each week so the money is there on the day — not before.</p>'
      +'<div class="fl"><label>What is it</label>'
      +'<input type="text" data-fit="name" value="'+esc(F.name)+'" placeholder="Japan trip"></div>'
      +'<div class="two"><div class="fl"><label>How much</label>'
      +'<input type="number" inputmode="decimal" data-fit="amount" value="'+((+F.amount)||"")+'" placeholder="0"></div>'
      +'<div class="fl"><label>Needed by</label>'
      +'<input type="date" data-fit="by" value="'+esc(F.by)+'"></div></div>'
      +'<button class="btn save" data-fitplan="1" style="width:100%">Work out the weekly amount</button>';

    const amt=+F.amount||0, by=parseISO(F.by);
    if(F.scanned && amt>0 && by){
      const G=goalSchedule(amt,F.by);
      if(!G){
        h+='<div class="result bad" style="margin-top:16px">Check the amount and the date.</div>';
      } else if(G.tooSoon){
        h+='<div class="result bad" style="margin-top:16px"><span class="big">That is very close</span>'
          +'Under two weeks away, so there is nothing to save into. Switch to '
          +'<b>Need to pay it now</b> and it will find the best week.</div>';
      } else {
        if(G.sp.conf==="solid")
          h+='<p class="legend" style="margin-top:14px">Worked out against the '
            +cash(G.sp.avg)+' a week you actually spend · <b>'+G.sp.label+'</b></p>';
        else
          h+='<div class="cut" style="margin-top:16px;border:1px solid var(--sand)">'
            +'<div class="item" style="border:0;padding-top:0">'
            +'<b style="color:var(--sand)">Spending estimate: '+G.sp.label+'.</b> '
            +'Using '+cash(G.sp.avg)+' a week for now. Keep logging and this sharpens — '
            +'at three weeks it is worth trusting. Until then the plan leans optimistic.</div></div>';

        if(G.firstDip)
          h+='<div class="cut" style="margin-top:10px">'
            +'<div class="item" style="border:0;padding-top:0">The week of '
            +lDate(G.firstDip.w.from)+' runs '+cash(G.firstDipShort)+' under your floor'
            +(G.dips>1?' (and '+(G.dips-1)+' other '+(G.dips===2?'week':'weeks')+' too)':'')
            +'. Nothing is set aside in '+(G.dips>1?'those weeks':'that week')
            +(G.startWeek?' — saving starts from '+lDate(G.startWeek.w.from)+'.':'.')
            +'</div></div>';

      if(G.neverRecovers){
          h+='<div class="result bad" style="margin-top:12px">'
            +'<span class="big">Not while this keeps up</span>'
            +'Your account never gets back above your floor across the whole period, so there '
            +'is nothing spare to save. A schedule here would be fiction.</div>'
            +'<div class="cut" style="margin-top:10px"><h4>What would actually help</h4>'
            +'<div class="item">Your bills are running ahead of your income. Check the Bills tab '
            +'for anything that has crept up or is entered twice.</div>'
            +'<div class="item">Lower your floor if it is set higher than it needs to be.</div>'
            +'<div class="item">For a tax bill, ask IRD about an instalment arrangement rather '
            +'than trying to save what is not there.</div></div>';
        } else if(G.feasible && G.phases.length){
          const p0=G.phases[0], p1=G.phases[1];
          h+='<div class="result" style="margin-top:12px">'
            +'<span class="big">'+cash(p0.perWeek)+' a week</span>'
            +'Start now'+(p1?', then it steps up to <b>'+cash(p1.perWeek)+'</b> from '
              +lDate(p1.from):' and hold it')+'. '
            +cash(G.amount)+' is covered by '+lDate(G.due)+'.</div>';
          if(G.phases.length>1){
            h+='<details class="setup" style="margin-top:10px"><summary>The whole schedule ('
              +G.phases.length+' steps)</summary>';
            G.phases.forEach((p,i)=>{
              h+='<div class="setrow"><label>'+(i===0?"From now":"From "+lDate(p.from))
                +' · '+p.weeks+' weeks</label>'
                +'<span style="font-family:var(--mono);color:var(--sand)">'+cash(p.perWeek)+'/wk</span></div>';
            });
            h+='<p class="note" style="padding-bottom:12px">Set one standing order and change it '
              +'on those dates. You only ever need the first figure in your head.</p></details>';
          }
          h+='<button class="btn save" data-fitsave="1" style="width:100%;margin-top:12px">'
            +'Add this to my plan</button>'
            +'<p class="note">Adds the payment on '+sDate(G.due)+' and sets your park amount to '
            +cash(p0.perWeek)+' plus what your other bills need. The app will remind you when '
            +'it is time to step up.</p>';
        } else {
          h+='<div class="result bad" style="margin-top:12px">'
            +'<span class="big">It does not fit</span>'
            +'Saving everything you can spare still only reaches <b>'+cash(G.reachable)
            +'</b> by '+lDate(G.due)+'. You are about <b>'+cash(G.shortPerWeek)
            +' a week short</b>.</div>'
            +'<div class="cut" style="margin-top:10px"><h4>Real options</h4>'
            +'<div class="item">Trim '+cash(G.shortPerWeek)+' a week from spending — check the '
            +'Spending tab for where.</div>'
            +'<div class="item">Push the date out, if it can move.</div>'
            +'<div class="item">Ask about paying it in instalments. For a tax bill, IRD '
            +'arrangements exist for exactly this.</div>'
            +'<div class="item">Borrow the gap and plan the repayment here as a new bill. '
            +'Better decided now than the week it is due.</div></div>';
        }
      }
    }

    const goals=goalList();
    if(goals.length){
      h+='<div class="sec-h" style="margin-top:26px"><h2>What you are saving for</h2></div>'
        +'<p class="legend">Each of these is already in your plan. The weekly figure is that '
        +'goal\'s share of what you park.</p>';
      goals.forEach(g=>{
        h+='<div class="ent"><span class="swatch" style="background:var(--sand)"></span>'
          +'<span class="eb"><b>'+esc(g.b.name||"Untitled")+'</b>'
          +'<span>'+lDate(g.due)+' · '+g.wks+' weeks away · '+cash(g.per)+' a week</span></span>'
          +'<span class="ea">'+cash(+g.b.amount||0)+'</span>'
          +'<button class="x" data-goaldel="'+g.b.id+'" title="Remove">×</button></div>';
      });
      const tot=goals.reduce((a,b)=>a+b.per,0);
      h+='<p class="note">Together they need <b>'+cash(tot)+' a week</b> set aside.</p>';
    }
    return h;
  }

  /* ── pay it now ── */
  const n=Math.max(1,+F.split||1), amt=+F.amount||0;
  h+='<div class="sec-h"><h2>Something unplanned?</h2></div>'
    +'<p class="sec-note">A repair, a bill you forgot, something that cannot wait. This finds the '
    +'first week you can pay it without breaking your '+money(+S.floor)+' floor.</p>';

  h+='<div class="fl"><label>What is it</label>'
    +'<input type="text" data-fit="name" value="'+esc(F.name)+'" placeholder="Car repair"></div>'
    +'<div class="two"><div class="fl"><label>Amount</label>'
    +'<input type="number" inputmode="decimal" data-fit="amount" value="'+(amt||"")+'" placeholder="0"></div>'
    +'<div class="fl"><label>Latest it can wait</label>'
    +'<input type="date" data-fit="by" value="'+esc(F.by)+'"></div></div>'
    +'<div class="fl"><label>Pay it over</label><select data-fit="split">'
    +[1,2,3,4,6,8,12].map(k=>'<option value="'+k+'"'+(n===k?" selected":"")+'>'
      +(k===1?"One payment":k+" weekly payments")+'</option>').join("")
    +'</select></div>'
    +'<button class="btn save" data-fitgo="1" style="width:100%">Find the best week</button>';

  if(!F.scanned||amt<=0) return h;

  const rows=fitScan(), best=fitBest(rows), floor=+S.floor||0, per=amt/n;
  if(F.pick===null&&best) F.pick=best.i;

  if(best){
    const r=rows[F.pick!==null?F.pick:best.i];
    h+='<div class="result'+(r.status==="ok"?"":" bad")+'" style="margin-top:16px">'
      +'<span class="big">'+(r.part?"Pay it now":"Start "+r.label)+'</span>'
      +(n>1?'Pay '+cash(per)+' a week for '+n+' weeks, last one '+sDate(r.last)+'. ':
             'Pay the whole '+cash(amt)+' that week. ')
      +'Your buffer bottoms out at <b>'+cash(r.worst)+'</b>'
      +(r.status==="ok" ? ', still above your floor.' :
        r.status==="tight" ? ', which dips under your floor but stays positive.' :
        ', which goes negative. Do not do it this week.')
      +'</div>';
  } else {
    const bestAny=rows.reduce((a,b)=>b.worst>a.worst?b:a,rows[0]);
    const short=floor-bestAny.worst;
    h+='<div class="result bad" style="margin-top:16px"><span class="big">It does not fit yet</span>'
      +'Even the best week ('+sDate(bestAny.from)+') leaves you '+cash(short)
      +' short of your floor. Spread it over more weeks, trim '
      +cash(short/(S.weeks||12))+' a week from somewhere, or push the date out.</div>';
  }

  h+='<div class="sec-h"><h2>Week by week</h2></div>'
    +'<p class="legend">Green fits · amber is tight · red breaks it · faded is past your date. '
    +'The figure is the lowest your buffer gets after paying.</p>';

  rows.forEach(r=>{
    h+='<button class="verdict'+(F.pick===r.i?" sel":"")+(r.late?" dead":"")+'" data-pick="'+r.i+'">'
      +'<span class="dot '+(r.late?"late":r.status)+'"></span>'
      +'<span class="wd"><b>'+r.label+'</b>'
      +'<span>'+(r.part?"pay it now":r.pay?"pay week":"off week")+(r.late?" · after your date":"")+'</span></span>'
      +'<span class="rt '+(r.status==="ok"?"teal":r.status==="tight"?"sand":"rose")+'">'
      +cash(r.worst)+'</span></button>';
  });

  if(F.pick!==null)
    h+='<button class="btn save" data-fitadd="1" style="width:100%;margin-top:14px">'
      +'Add it to my plan</button>'
      +'<p class="note">This drops it into your weekly ledger as a real payment, so every '
      +'week after it updates too.</p>';
  return h;
}

const CURRENCIES=[["NZD","$"],["AUD","A$"],["JPY","¥"],["USD","US$"],["EUR","€"],["GBP","£"],
  ["HKD","HK$"],["SGD","S$"],["THB","฿"],["KRW","₩"],["CNY","¥"],["TWD","NT$"],

const curSym=c=>{const f=CURRENCIES.find(x=>x[0]===c);return f?f[1]:"$";};
const activeCur=()=>D.settings.cur||"NZD";
const activeRate=()=>{
  const c=activeCur();
  if(c==="NZD") return 1;

};
function foreign(n,c){

/* ── set-aside fund ──────────────────────────────────────
   Parked money is still your cash, just spoken for. So the honest
   "safe to spend" figure is closing balance minus the pot.
   Two constraints bound how much you can park each week:
     the pot must never go negative when a lumpy bill lands
     what's left outside the pot must never fall below your floor  */
function goalWeekly(){ return goalList().reduce((a,g)=>a+g.per,0); }
function autoPark(){
  const s=smoothed();
  return s.billsLumpy + s.debtMin + goalWeekly();
}
function parkAmount(){
  const S=D.settings;
  return S.parkMode==="manual" ? (+S.parkAmount||0) : autoPark();
}
function fundPlan(nOverride){
  const W=buildWeeks(nOverride), S=D.settings;
  const floor=+S.floor||0;
  /* Pots hold exactly what you have moved into them — nothing is assumed.
     They pay out when a bill they cover falls due, and drain as they go. */
  let potB=Math.max(0,+S.fundStart||0), potG=Math.max(0,+S.goalStart||0);
  let worstFund=Infinity, worstSpend=Infinity, n=0;
  const rows=W.map(w=>{
    if(!w.part) n++;
    /* what a pot still owes on an unmarked line: money set aside earlier has
       already left everyday, so the pot pays it now */
    /* only money you actually earmarked leaves a pot — an unmarked bill is
       paid from everyday, so the float sits untouched until you allocate it */
    const asideB=w.outs.filter(o=>!o.goal).reduce((a,b)=>a+b.aside,0);
    const asideG=w.outs.filter(o=>o.goal).reduce((a,b)=>a+b.aside,0);

    const bB=potB, bG=potG;
    const fromB=Math.min(bB,asideB), afterB=bB-fromB;
    const fromG=Math.min(bG,asideG), afterG=bG-fromG;
    potB=afterB; potG=afterG;

    const pot=afterB+afterG;
    const everyday=w.closing;          // closing already excludes anything marked
    if(pot<worstFund) worstFund=pot;
    if(everyday<worstSpend) worstSpend=everyday;
    const allHandled = w.outs.length>0 && w.outs.every(o=>o.paid||o.aside>=o.amount-0.01);
    return {w, contribs:n, allHandled,
      bills:{before:bB,out:fromB,after:afterB,due:asideB},
      goals:{before:bG,out:fromG,after:afterG,due:asideG},
      potBefore:bB+bG, potAfter:pot, spend:everyday, fund:pot};
  });
  /* what you can spend THIS week without any later week breaking the floor */
  let tail=Infinity, tailIdx=-1;
  for(let i=rows.length-1;i>=0;i--){
    if(rows[i].spend<tail){ tail=rows[i].spend; tailIdx=i; }
    rows[i].safe=Math.max(0, tail-floor);
    rows[i].limitedBy=tailIdx;
    rows[i].limitAmount=tail;
  }
  return {rows, P:parkAmount(), auto:autoPark(), worstFund, worstSpend,
    potBills:Math.max(0,+S.fundStart||0), potGoals:Math.max(0,+S.goalStart||0)};
}
function viewFundCard(){
  const S=D.settings, f=fundPlan(), manual=S.parkMode==="manual";
  const open=!!D.open.park;
  const sm2=smoothed(), gw=goalWeekly(), bw=sm2.billsLumpy+sm2.debtMin;
  const potB=r2(Math.max(0,+S.fundStart||0)), potG=r2(Math.max(0,+S.goalStart||0));

      +'<b>Move '+cash(gw)+' a week into the goals account.</b> The tax and anything else with a '

const CATS=[
  ["Groceries","#3FD0AE"],["Takeaway & coffee","#E8B15C"],["Transport & fuel","#5EC7F0"],
  ["Household","#A78BFA"],["Kids","#F08BB4"],["Health","#A3D977"],
  ["Fun & going out","#FF6B5E"],["Clothes","#6E8FF5"],["Debt payment","#F2C14E"],["Other","#7E9A98"]
];
const DEBT_CAT="Debt payment";
const catColor=c=>{const f=CATS.find(x=>x[0]===c);return f?f[1]:"#7E9A98";};
const cash=n=>{const v=Math.abs(n);return (n<0?"-$":"$")+(v%1?v.toFixed(2):Math.round(v).toLocaleString("en-NZ"));};
let SP={amount:"",cat:"Groceries",note:"",date:"",period:"week",debtId:""};

function periodStart(p){
  const t=new Date(), today=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  if(p==="week"){
    const ws=(D.settings.weekStart===undefined)?1:+D.settings.weekStart;
    return addDays(today,-(((today.getDay()-ws)+7)%7));
  }
  if(p==="month") return addDays(today,-29);
  return new Date(1970,0,1);
}
function spendIn(p){
  const from=periodStart(p);
  return (D.spend||[]).filter(s=>{const d=parseISO(s.date);return d&&d>=from;});
}
function byCat(list){
  const m={};
  list.forEach(s=>{ m[s.cat]=(m[s.cat]||0)+(+s.amount||0); });
  return Object.keys(m).map(k=>({cat:k,amt:m[k],color:catColor(k)}))
    .sort((a,b)=>b.amt-a.amt);
}
function donut(parts,total){
  const r=58, cx=95, cy=95, circ=2*Math.PI*r;
  let off=0, segs="";
  parts.forEach(p=>{
    const len=circ*(p.amt/total);
    segs+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+p.color+'"'
      +' stroke-width="30" stroke-dasharray="'+len.toFixed(2)+' '+(circ-len).toFixed(2)+'"'
      +' stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')"></circle>';
    off+=len;
  });
  return '<svg viewBox="0 0 190 190" width="190" height="190" role="img">'
    +'<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#152528" stroke-width="30"></circle>'
    +segs
    +'<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" fill="#E9F1EF"'
    +' font-family="ui-monospace,monospace" font-size="24" font-weight="700">'+cash(total)+'</text>'
    +'<text x="'+cx+'" y="'+(cy+16)+'" text-anchor="middle" fill="#8AA5A3"'
    +' font-family="ui-monospace,monospace" font-size="10" letter-spacing="1.5">SPENT</text>'
    +'</svg>';
}

        +'<span class="eb"><b>'+esc(s.cat)+'</b>'

        +'<button class="x" data-spdel="'+s.id+'" title="Remove">×</button></div>';
    });
    if(list.length>60) h+='<p class="note">Showing the most recent 60 of '+list.length+'.</p>';
  }

function cutPanel(parts,total){
  const inP=spendIn(SP.period);
  if(!inP.length) return "";
  const dates=inP.map(s=>parseISO(s.date)).filter(Boolean).sort((a,b)=>a-b);
  const span=Math.max(1,Math.round((new Date()-dates[0])/86400000)+1);
  const debtPaid=inP.filter(s=>s.cat===DEBT_CAT).reduce((a,b)=>a+(+b.amount||0),0);
  const living=total-debtPaid;
  const perWeek=living/span*7;
  const free=smoothed().free;
  const gap=perWeek-free;

  let h='<div class="cut"><h4>Where the money is going</h4>';
  if(debtPaid>0)
    h+='<div class="item">You\'ve put <b>'+cash(debtPaid)+'</b> extra at your debt in this '
      +'stretch. That\'s not spending, so it\'s left out of everything below.</div>';
  h+='<div class="item">Day-to-day you\'re spending about <b>'+cash(perWeek)+' a week</b> on top '
    +'of your bills. Your plan leaves <b>'+cash(free)+'</b> free.'
    +(gap>0
      ? ' That\'s <b>'+cash(gap)+' a week over</b> — roughly '+cash(gap*52)+' a year coming out of your buffer.'
      : ' You\'re inside it by '+cash(-gap)+' a week.')
    +'</div>';

  const trim=parts.filter(p=>p.cat!==DEBT_CAT);
  if(gap>0 && trim.length){
    const top=trim.slice(0,3);
    h+='<div class="item">Trimming these three by a quarter each would claw back <b>'
      +cash(top.reduce((a,b)=>a+b.amt,0)/span*7*0.25)+' a week</b>:</div>';
    top.forEach(p=>{
      const w=p.amt/span*7;
      h+='<div class="item"><b>'+esc(p.cat)+'</b> — '+cash(w)+' a week. '
        +'Cut a quarter and you keep '+cash(w*0.25)+' a week, '+cash(w*0.25*52)+' a year.</div>';
    });
  } else if(gap<=0){
    h+='<div class="item">Nothing needs cutting at this rate. Any of it you don\'t spend '
      +'is worth throwing at the most expensive debt you have.</div>';
  }
  return h+'</div>';
}

function closeSheet(){

  sh.style.transition=""; sh.style.transform="";
  sh.classList.remove("on");
  document.getElementById("bd").classList.remove("on");

}
function commit(){
  if(!editing)return;
  const sh=document.getElementById("sheet");
  sh.querySelectorAll("[data-f]").forEach(el=>{
    const k=el.dataset.f;
    editing.item[k] = (el.type==="number") ? (Number(el.value)||0) : el.value;
  });
  if(editing.kind==="kidincome"||editing.kind==="kidbill"){
    const key = editing.kind==="kidincome" ? "incomes" : "bills";
    if(editing.kind==="kidbill" && editing.sub==="goal"){
      editing.item.kind="goal";
      D.bills=D.bills.filter(b=>b.kind!=="goal"||b.id===editing.item.id);  // one goal at a time
    } else if(editing.kind==="kidbill") editing.item.kind="owe";
    const arr=D[key].slice();
    const idx=arr.findIndex(x=>x.id===editing.item.id);
    if(idx>=0) arr[idx]=editing.item; else arr.push(editing.item);
    D[key]=arr; save(); closeSheet(); render();
    return;
  }
  const key = editing.kind==="income"?"incomes": editing.kind==="bill"?"bills":"debts";
  const arr = D[key].slice();
  const idx = arr.findIndex(x=>x.id===editing.item.id);
  if(idx>=0) arr[idx]=editing.item; else arr.push(editing.item);
  D[key]=arr; save(); closeSheet(); render();
}

async function backup(){
  await store.set(profKey(ROSTER.active),JSON.stringify(D));   // flush current first
  const bundle={app:"payday", saved:toISO(new Date()), roster:ROSTER, profiles:{}};
  for(const p of ROSTER.list){
    try{ const raw=await store.get(profKey(p.id)); bundle.profiles[p.id]=raw?JSON.parse(raw):blank(); }
    catch(e){ bundle.profiles[p.id]=blank(); }
  }
  const json=JSON.stringify(bundle,null,2);
  const name="payday-backup-"+toISO(new Date())+".json";
  try{
    const file=new File([json],name,{type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:"Payday backup"})
        .catch(err=>{ if(!err||err.name!=="AbortError") downloadBackup(json,name); });
      return;
    }
  }catch(e){}
  downloadBackup(json,name);
}
function restore(file){
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const p=JSON.parse(r.result);
      if(p && p.app==="payday" && p.profiles){          // everyone in one file
        ROSTER=p.roster&&p.roster.list&&p.roster.list.length ? p.roster
             : {active:"main",list:[{id:"main",name:"Me",type:"adult"}]};
        for(const id of Object.keys(p.profiles))
          await store.set(profKey(id),JSON.stringify(p.profiles[id]));
        saveRoster();
        if(!ROSTER.list.some(x=>x.id===ROSTER.active)) ROSTER.active=ROSTER.list[0].id;
        await loadProfile(ROSTER.active);
        closeSheet(); render(true);
        return;
      }
      if(!p||!p.settings) throw 0;                       // older single-person file
      const base=blank();
      D=Object.assign(base,p);
      D.settings=Object.assign(base.settings,p.settings);
      save(); render();
    }catch(e){ alert("That file doesn't look like a Payday backup."); }
  };
  r.readAsText(file);
}
function downloadBackup(json,name){
  try{
    const blob=new Blob([json],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
    setTimeout(()=>alert("Saved to your Downloads folder as\n"+name),300);
  }catch(e){ showBackupText(json); }
}
function showBackupText(json){
  const sh=document.getElementById("sheet");
  sh.innerHTML='<div class="grab"></div><h3>Copy your backup</h3>'
    +'<p class="sec-note">Saving a file didn\'t work on this device. Copy this text and '

    +'<textarea id="bkText" readonly style="width:100%;height:180px;background:var(--surface2);'
    +'border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text);'

  const t=document.getElementById("bkText"); if(t) t.value=json;

}

function updateFxHint(){
  const el=document.getElementById("fxhint");
  if(!el) return;
  const cur=activeCur();
  if(cur==="NZD"){ el.textContent=""; return; }
  const aEl=document.querySelector('[data-sp="amount"]');
  const rEl=document.querySelector('[data-rate]');
  const a=aEl?Number(aEl.value)||0:0;
  const r=rEl?Number(rEl.value)||0:0;
  el.innerHTML = (a>0&&r>0)
    ? '= <b style="color:var(--teal)">'+cash(a/r)+' NZD</b>'
    : (r>0?'':'<span style="color:var(--sand)">Enter the rate below</span>');

function briefing(){
  const S=D.settings, F=fundPlan(), sm=smoothed();
  const line=i=>i.name+" "+cash(+i.amount||0)+" "+FLBL[i.freq].toLowerCase()
    +" (next "+(parseISO(i.anchor)?sDate(parseISO(i.anchor)):"?")+")";
  let t="Here is my household cash flow. All figures NZD.\n\n";
  t+="Cash on hand: "+cash(+S.openingCash||0)+"\n";
  t+="Safety floor I never want to go below: "+cash(+S.floor||0)+"\n";
  t+="Already set aside in the pot: "+cash(+S.fundStart||0)+"\n";
  t+="Suggested weekly set-aside: "+cash(F.auto)+"\n";
  t+="Weeks run "+["Sunday","Monday","","","","Friday","Saturday"][+S.weekStart||1]+" to "
    +["Saturday","Sunday","","","","Thursday","Friday"][+S.weekStart||1]+".\n\n";
  t+="INCOME\n"+(D.incomes.map(line).join("\n")||"none")+"\n\n";
  t+="BILLS\n"+(D.bills.map(line).join("\n")||"none")+"\n\n";
  t+="DEBTS\n"+(D.debts.map(d=>d.name+" owing "+cash(+d.balance||0)+" at "+(+d.apr||0)
    +"% p.a., minimum "+cash(+d.minPayment||0)+" "+FLBL[d.freq].toLowerCase()).join("\n")||"none")+"\n\n";
  t+="WEEK BY WEEK (start / in / out / closing cash / pot / spendable outside pot)\n";
  F.rows.forEach(r=>{
    t+=weekName(r.w)+" | in "+cash(r.w.totalIn)+" | out "+cash(r.w.totalOut)
      +" | closing "+cash(r.w.closing)+" | pot "+cash(r.fund)+" | spendable "+cash(r.spend)+"\n";
  });
  t+="\nLowest spendable point across the period: "+cash(F.worstSpend)+"\n";
  t+="Lowest the pot gets: "+cash(F.worstFund)+"\n";
  t+="Bills float holds "+cash(F.potBills)+", goals account holds "+cash(F.potGoals)+"\n";
  const sp=spendIn("month");
  if(sp.length){
    t+="\nLOGGED SPENDING, LAST 30 DAYS\n";
    byCat(sp).forEach(c=>{ t+=c.cat+": "+cash(c.amt)+"\n"; });
  }
  t+="\nYou are helping me plan. Be specific and use my actual numbers. "
    +"Point out anything that looks wrong or risky. Do not give regulated financial advice.\n";
  return t;
}

  const t=document.querySelector("[data-aiq]"); if(t) AI.q=t.value;

}
async function sendAI(){
  readAI();
  const key=(D.settings.aiKeys||{})[AI.provider]||"";
  if(!key){ AI.err="Paste an API key first."; openAI(); return; }
  if(!AI.q.trim()){ AI.err="Type a question first."; openAI(); return; }
  AI.err=""; AI.busy=true;
  const first=AI.msgs.length===0;
  const text=(first?briefing()+"\n":"")+AI.q.trim();
  AI.msgs.push({role:"user",text:AI.q.trim()});
  AI.q=""; save(); openAI();
  try{
    let out="";
    if(AI.provider==="claude"){
      const hist=AI.msgs.map((m,i)=>({role:m.role==="user"?"user":"assistant",
        content:(i===0?briefing()+"\n":"")+m.text}));
      hist[hist.length-1].content=text;
      const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
        headers:{"content-type":"application/json","x-api-key":key,
          "anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-5",max_tokens:1200,messages:hist})});
      const d=await r.json();
      if(d.error) throw new Error(d.error.message||"API error");
      out=(d.content||[]).filter(x=>x.type==="text").map(x=>x.text).join("\n");
    } else {
      const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"
        +"gemini-2.5-flash:generateContent?key="+encodeURIComponent(key),
        {method:"POST",headers:{"content-type":"application/json"},
         body:JSON.stringify({contents:[{role:"user",parts:[{text:text}]}]})});
      const d=await r.json();
      if(d.error) throw new Error(d.error.message||"API error");
      const c=(d.candidates||[])[0];
      out=(((c||{}).content||{}).parts||[]).map(p=>p.text).join("\n");
    }
    AI.msgs.push({role:"ai",text:out||"(empty reply)"});
  }catch(e){
    AI.err=(e&&e.message)?e.message:"Couldn't reach the API.";
    AI.msgs.pop();
  }
  AI.busy=false; openAI();
}

/* ── kid view ────────────────────────────────────────────
   One screen. Money in, what you owe, what you're saving for,
   and what spending costs you in days. */
function kidPlan(extraWeekly){
  const S=D.settings;
  const t=new Date(), today=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  const weekly=D.incomes.reduce((a,b)=>a+((+b.amount||0)*PER_YEAR[b.freq])/52,0);
  const owes=D.bills.filter(b=>b.kind!=="goal")
    .map(b=>({name:b.name,amount:+b.amount||0,due:parseISO(b.anchor),id:b.id}))
    .filter(o=>o.due).sort((a,b)=>a.due-b.due);
  const goal=D.bills.find(b=>b.kind==="goal");
  let cash=+S.openingCash||0, late=null, buyDay=null;
  const need=goal?(+goal.amount||0):0;
  const goalDue=goal&&parseISO(goal.anchor);
  for(let w=0; w<80; w++){
    const day=addDays(today,w*7);
    cash += (w?weekly:0) - (w?(extraWeekly||0):0);
    owes.forEach(o=>{
      if(!o.paidOn && o.due<=addDays(day,6)){
        if(cash>=o.amount){ cash-=o.amount; o.paidOn=day; }
        else if(!late) late=o;
      }
    });
    if(goal && !buyDay && cash>=need && owes.every(o=>o.paidOn)) buyDay=day;
    if(buyDay && owes.every(o=>o.paidOn)) break;
  }
  return {weekly, owes, goal, need, goalDue, buyDay, late, inTime: goalDue&&buyDay?buyDay<=goalDue:null};
}

    +'font-size:11px;color:var(--rose)">'+(p.goal?"change":"+ add")+'</button></div>';
  h+=p.goal
    ? '<button class="card" data-kid="goal" data-id="'+p.goal.id+'">'
      +'<span><span class="nm">'+esc(p.goal.name||"My goal")+'</span>'
      +'<span class="meta">'+(p.goalDue?"needed by "+lDate(p.goalDue):"no date set")+'</span></span>'
      +'<span class="amt rose">'+cash(p.need)+'</span></button>'

  /* the plan */
  if(p.weekly>0 && (p.goal||owes.length)){
    h+='<div class="cut" style="margin-top:22px"><h4>Here is how it works out</h4>';

      h+='<div class="item">'+esc(p.goal.name||"Your goal")+' costs '+cash(p.need)+'. '
        +(p.buyDay
          ? 'Saving everything left, you can buy it on <b>'+lDate(p.buyDay)+'</b>.'
            +(p.inTime===true?' That is in time. ✓'

      h+='</div>';

}

["Minimum payment","What you're required to pay, and how often. This gets scheduled into your weekly plan automatically."],
["Extra per week","Anything above the minimums. This is the lever — change it and watch the debt-free date move."],
["Highest interest first","Pays the most expensive debt first. Costs you the least overall."],

fit:["Planning ahead","Two different questions live here. Saving for a date, and paying for something that can't wait.",[
["Saving for a date","Tell it what, how much and when. It looks at what each week can actually carry — the balance, less your floor, less what you really spend — and back-loads the saving into the months that can afford it. Tight months contribute a little, flush months carry more."],
["One figure at a time","You only ever need the current amount. The full schedule sits behind a tap, and the Plan tab reminds you on the day a step-up is due. Set one standing order, change it when told."],
["Why it needs your spending","Weeks with nothing logged look richer than they are. The estimate is damped so a single logged day can't become a whole week's rate, and it is labelled rough, getting there, or solid depending on how much you have logged. It never blocks the plan — it just tells you how much to trust it."],
["Weeks under your floor","They contribute nothing and saving starts after them. A tight patch never stops you planning ahead. The only time a schedule disappears is when the account never gets back above the floor at all, and then you get the shortfall and real options instead."],
