};
function openHelp(){
  const H=HELP[tab]||HELP.plan;
  let h='<div class="grab"></div><h3>'+H[0]+'</h3>'
    +'<p class="sec-note" style="margin-bottom:4px">'+H[1]+'</p><div class="help">';
  H[2].forEach(x=>{ h+='<h4>'+x[0]+'</h4><p>'+x[1]+'</p>'; });
  h+='</div><p class="note" style="margin-top:18px">Everything you type stays on this phone. '
    +'Nothing is sent anywhere unless you use the AI button or Back up.</p>'
    +'<div class="sheet-actions"><button class="btn save" data-act="close">Got it</button></div>';
  const sh=document.getElementById("sheet");
  sh.innerHTML=h;
  sh.scrollTop=0;
  sh.classList.add("on"); document.getElementById("bd").classList.add("on");
}

/* ── swipe the sheet down to close ── */
(function(){
  const sh=document.getElementById("sheet");
  let y0=0, dy=0, dragging=false;
  const isField=t=>t.closest && t.closest("input,textarea,select,button");
  sh.addEventListener("touchstart",e=>{
    if(!sh.classList.contains("on")) return;
    const onHandle=e.target.classList && e.target.classList.contains("grab");
    if(!onHandle){
      if(sh.scrollTop>0) return;      // let it scroll first
      if(isField(e.target)) return;   // don't hijack taps on controls
    }
    y0=e.touches[0].clientY; dy=0; dragging=true;
    sh.style.transition="none";
  },{passive:true});
  sh.addEventListener("touchmove",e=>{
    if(!dragging) return;
    dy=e.touches[0].clientY-y0;
    if(dy<=0){ dy=0; sh.style.transform=""; return; }
    e.preventDefault();
    sh.style.transform="translateY("+dy+"px)";
  },{passive:false});
  const finish=()=>{
    if(!dragging) return;
    dragging=false;
    sh.style.transition="";
    sh.style.transform="";
    if(dy>90) closeSheet();
    dy=0;
  };
  sh.addEventListener("touchend",finish);
  sh.addEventListener("touchcancel",finish);
})();

/* ── events ── */
document.addEventListener("click",e=>{
  const nav=e.target.closest("nav button");
  if(nav){ tap(); tab=nav.dataset.tab; render(true); return; }
  const wk=e.target.closest("[data-week]");
  if(wk){
    tap();
    const i=+wk.dataset.week;
    const card=wk.closest(".wk");
    const before=card?card.getBoundingClientRect().top:null;
    const cur=(D.open.week===undefined)?0:D.open.week;
    D.open.week=(cur===i)?null:i;
    save(); render();
    if(before!==null){
      const el=document.querySelector('.wk[data-idx="'+i+'"]');
      if(el) window.scrollBy(0, el.getBoundingClientRect().top-before);
    }
    return;
  }
  const ed=e.target.closest("[data-edit]");
  if(ed){ tap(); openSheet(ed.dataset.edit, ed.dataset.id); return; }
  const act=e.target.closest("[data-act]");
  if(act){
    tap();
    if(act.dataset.act==="save") commit();
    else if(act.dataset.act==="close") closeSheet();
    else if(act.dataset.act==="delete"){
      const key = editing.kind==="kidincome" ? "incomes"
                : editing.kind==="kidbill" ? "bills"
                : editing.kind==="income"?"incomes":editing.kind==="bill"?"bills":"debts";
      D[key]=D[key].filter(x=>x.id!==editing.item.id); save(); closeSheet(); render();
    }
    return;
  }
  const go=e.target.closest("[data-fitgo]");
  if(go){ tap(); readFit(); F.scanned=true; F.pick=null; render(); return; }
  const pk=e.target.closest("[data-pick]");
  if(pk){ tap(); readFit(); F.pick=+pk.dataset.pick; render(); return; }
  const fa=e.target.closest("[data-fitadd]");
  if(fa){
    tap(); readFit();
    const n=Math.max(1,+F.split||1), per=(+F.amount||0)/n;
    const rows=fitScan(), r=rows[F.pick]||fitBest(rows);
    if(r&&per>0){
      const label=(F.name||"Unplanned payment").trim();
      for(let k=0;k<n;k++){
        D.bills.push({id:uid(), name:label+(n>1?" ("+(k+1)+" of "+n+")":""),
          amount:per, freq:"once", anchor:toISO(addDays(r.from,k*7))});
      }
      F={name:"",amount:0,by:"",split:1,scanned:false,pick:null,mode:F.mode};
      save(); tab="plan"; render();
    }
    return;
  }
  /* profiles */
  const ar=e.target.closest("[data-arrived]");
  if(ar){
    tap();
    if(!D.settings.arrived) D.settings.arrived={};
    if(!D.settings.landed) D.settings.landed={};
    const key=ar.dataset.arrived, prev=D.settings.arrived[key];
    if(prev!==undefined){                         // second tap undoes it
      D.settings.openingCash=r2((+D.settings.openingCash||0)-r2(prev));
      delete D.settings.arrived[key];
      delete D.settings.landed[key];
      save(); render(); return;
    }
    const exp=Number(ar.dataset.amt)||0;
    const v=prompt("How much actually landed?", exp.toFixed(2));
    const n=Number(v);
    if(!(n>0)) return;
    D.settings.arrived[key]=r2(n);
    D.settings.openingCash=r2((+D.settings.openingCash||0)+r2(n));
    D.settings.cashUpdated=toISO(new Date());
    delete D.settings.landed[key];
    save(); render(); return;
  }
  const ai=e.target.closest("[data-alreadyin]");
  if(ai){
    tap();
    if(!D.settings.landed) D.settings.landed={};
    const key=ai.dataset.alreadyin;
    if(D.settings.arrived && D.settings.arrived[key]!==undefined) return;  // use the other button
    if(D.settings.landed[key]) delete D.settings.landed[key];
    else D.settings.landed[key]=true;
    save(); render(); return;
  }
  const mk=e.target.closest("[data-mark]");
  if(mk){
    tap();
    if(!D.settings.marks) D.settings.marks={};
    const key=mk.dataset.key, mode=mk.dataset.mark, full=Number(mk.dataset.amt)||0;
    const cur=D.settings.marks[key];
    const cash0=()=>+D.settings.openingCash||0;

    const dId=mk.dataset.debtid||null;
    /* undo whatever was there */
    if(cur){
      if(cur.debtId){
        const dd=D.debts.find(x=>x.id===cur.debtId);
        if(dd) dd.balance=r2((+dd.balance||0)+(+cur.amount||0));
      }
      if(cur.state==="paid") D.settings.openingCash=r2(cash0()+(+cur.amount||0));
      else {
        D.settings.openingCash=r2(cash0()+(+cur.amount||0));
        if(cur.goal) D.settings.goalStart=r2(Math.max(0,(+D.settings.goalStart||0)-(+cur.amount||0)));
        else D.settings.fundStart=r2(Math.max(0,(+D.settings.fundStart||0)-(+cur.amount||0)));
      }
      delete D.settings.marks[key];
      if(cur.state===mode){ save(); render(); return; }   // second tap = undo
    }

    if(mode==="paid"){
      D.settings.marks[key]={state:"paid",amount:r2(full),debtId:dId||undefined};
      D.settings.openingCash=r2(cash0()-full);
      if(dId){
        const dd=D.debts.find(x=>x.id===dId);
        if(dd) dd.balance=r2(Math.max(0,(+dd.balance||0)-r2(full)));
      }
    } else {
      const isGoal=mk.dataset.goal==="1";
      const v=prompt("How much did you move across?", full.toFixed(2));
      const n=Number(v);
      if(!(n>0)){ save(); render(); return; }
      const isPark = key.indexOf("goalpark|")===0 || key.indexOf("billpark|")===0;
      const amt=r2(isPark ? n : Math.min(n,full));
      D.settings.marks[key]={state:"aside",amount:amt,goal:isGoal};
      D.settings.openingCash=r2(cash0()-amt);
      if(isGoal) D.settings.goalStart=r2((+D.settings.goalStart||0)+amt);
      else D.settings.fundStart=r2((+D.settings.fundStart||0)+amt);
    }
    D.settings.cashUpdated=toISO(new Date());
    save(); render(); return;
  }
  if(e.target.closest("[data-parktoggle]")){ tap(); D.open.park=!D.open.park; save(); render(); return; }
  if(e.target.closest("[data-people]")){ tap(); peopleSheet(); return; }
  if(e.target.closest("h1") && multi()){ tap(); peopleSheet(); return; }
  const sw=e.target.closest("[data-switch]");
  if(sw){ tap(); switchProfile(sw.dataset.switch); return; }
  const dp=e.target.closest("[data-delprof]");
  if(dp){
    tap();
    const pr=ROSTER.list.find(x=>x.id===dp.dataset.delprof);
    if(pr && confirm("Remove "+pr.name+" and everything on their page?")){
      store.set(profKey(pr.id),JSON.stringify(blank()));
      ROSTER.list=ROSTER.list.filter(x=>x.id!==pr.id);
      if(ROSTER.active===pr.id){ ROSTER.active="main"; saveRoster(); switchProfile("main"); return; }
      saveRoster(); peopleSheet();
    }
    return;
  }
  if(e.target.closest("[data-addkid]")||e.target.closest("[data-addadult]")){
    tap();
    const kid=!!e.target.closest("[data-addkid]");
    const nm=prompt(kid?"What's their name?":"Name for this person?");
    if(!nm||!nm.trim()) return;
    if(ROSTER.list.length===1 && !ROSTER.list[0].nameSet){
      const mine=prompt("And what should your own page be called?","Me");
      ROSTER.list[0].name=(mine&&mine.trim())||"Me";
      ROSTER.list[0].nameSet=true;
    }
    const id=uid();
    ROSTER.list.push({id, name:nm.trim(), type:kid?"kid":"adult"});
    saveRoster(); switchProfile(id);
    return;
  }
  const ke=e.target.closest("[data-kid]");
  if(ke){ tap(); kidSheet(ke.dataset.kid, ke.dataset.id); return; }
  if(e.target.closest("[data-kidspend]")){
    tap();
    const v=prompt("How much did you spend?");
    const n=Number(v);
    if(n>0){
      if(!D.spend) D.spend=[];
      D.spend.push({id:uid(),amount:n,cat:"Other",note:"",date:toISO(new Date())});
      D.settings.openingCash=(+D.settings.openingCash||0)-n;
      save(); render();
    }
    return;
  }
  if(e.target.closest("[data-help]")){ tap(); openHelp(); return; }
  const pk2=e.target.closest("[data-park]");
  if(pk2){ tap();
    D.settings.parkMode=pk2.dataset.park;
    if(pk2.dataset.park==="manual" && !D.settings.parkAmount)
      D.settings.parkAmount=Math.round(autoPark());
    save(); render(); return; }
  const sp2=e.target.closest("[data-setpark]");
  if(sp2){ tap();
    D.settings.parkMode="manual";
    D.settings.parkAmount=Math.round(Number(sp2.dataset.setpark)*100)/100;
    save(); render(); return; }
  if(e.target.closest("[data-ai]")){ tap(); AI.err=""; openAI(); return; }
  const ap=e.target.closest("[data-aiprov]");
  if(ap){ tap(); readAI(); AI.provider=ap.dataset.aiprov; AI.msgs=[]; AI.err=""; save(); openAI(); return; }
  const apr=e.target.closest("[data-aipreset]");
  if(apr){ tap(); AI.q=apr.dataset.aipreset; openAI(); return; }
  if(e.target.closest("[data-aicopy]")){
    tap(); readAI(); save();
    const payload=briefing()+"\nMY QUESTION: "+(AI.q.trim()||"What should I change first?");
    try{ navigator.clipboard.writeText(payload); }catch(err){}
    window.open(AI_SITES[AI.provider],"_blank");
    return;
  }
  if(e.target.closest("[data-aisend]")){ tap(); sendAI(); return; }
  const fm=e.target.closest("[data-fitmode]");
  if(fm){ tap(); readFit(); F.mode=fm.dataset.fitmode; F.scanned=false; F.pick=null; render(true); return; }
  if(e.target.closest("[data-fitplan]")){ tap(); readFit(); F.scanned=true; render(); return; }
  const gd=e.target.closest("[data-goaldel]");
  if(gd){ tap();
    D.bills=D.bills.filter(b=>b.id!==gd.dataset.goaldel);
    save(); render(); return; }
  if(e.target.closest("[data-fitsave]")){
    tap(); readFit();
    const amt=Number(F.amount)||0, by=parseISO(F.by);
    if(amt<=0||!by) return;
    const G=goalSchedule(amt,F.by);
    if(!G||G.tooSoon||!G.feasible||!G.phases.length) return;
    const id=uid();
    D.bills.push({id:id, name:(F.name||"Saved-for payment").trim(),
      amount:amt, freq:"once", anchor:F.by,
      plan:G.phases.map(p=>({from:toISO(p.from), perWeek:p.perWeek})), step:0});
    const t=new Date(), today=new Date(t.getFullYear(),t.getMonth(),t.getDate());
    const wks=Math.floor((by-today)/(7*86400000));
    D.settings.weeks=Math.max(+D.settings.weeks||12, Math.min(104, wks+2));
    D.settings.parkMode="auto";     // autoPark now counts goals, so let it recompute
    F={name:"",amount:0,by:"",split:1,scanned:false,pick:null,mode:F.mode};
    save(); tab="plan"; render(true);
    return;
  }
  const sb=e.target.closest("[data-stepup]");
  if(sb){
    tap();
    const b=D.bills.find(x=>x.id===sb.dataset.stepup);
    if(b&&b.plan){
      const from=(b.step||0), next=Math.min(b.plan.length-1,from+1);
      const diff=b.plan[next].perWeek-b.plan[from].perWeek;
      D.settings.parkMode="manual";
      D.settings.parkAmount=Math.round(((+D.settings.parkAmount||0)+diff)*100)/100;
      b.step=next;
      save(); render();
    }
    return;
  }
  const gt=e.target.closest("[data-goto]");
  if(gt){ tap(); tab=gt.dataset.goto; render(true); return; }
  const chip=e.target.closest("[data-cat]");
  if(chip){ tap(); readSpend(); SP.cat=chip.dataset.cat; render(); return; }
  const per=e.target.closest("[data-per]");
  if(per){ tap(); readSpend(); SP.period=per.dataset.per; render(); return; }
  const spa=e.target.closest("[data-spadd]");
  if(spa){
    tap(); readSpend();
    const typed=Number(SP.amount)||0;
    if(typed<=0){ alert("Put an amount in first."); return; }
    const cur=activeCur(), rate=activeRate();
    if(cur!=="NZD" && rate<=0){ alert("Put the exchange rate in first — how many "+cur+" one NZD buys."); return; }
    const nzd = cur==="NZD" ? typed : typed/rate;
    if(!D.spend) D.spend=[];
    const rec={id:uid(), amount:nzd, cat:SP.cat, note:(SP.note||"").trim(),
      date:SP.date||toISO(new Date())};
    if(cur!=="NZD") rec.fx={cur:cur, orig:typed, rate:rate};
    if(SP.cat===DEBT_CAT){
      const d=D.debts.find(x=>x.id===SP.debtId)||D.debts[0];
      if(!d){ alert("Add a debt on the Debt tab first."); return; }
      rec.debtId=d.id; rec.debtName=d.name;
      d.balance=Math.max(0,(+d.balance||0)-nzd);
    }
    D.spend.push(rec);
    D.settings.openingCash=r2((+D.settings.openingCash||0)-nzd);
    D.settings.cashUpdated=toISO(new Date());
    SP.amount=""; SP.note="";
    save(); render(); return;
  }
  const spd=e.target.closest("[data-spdel]");
  if(spd){
    tap();
    const id=spd.dataset.spdel, it=(D.spend||[]).find(x=>x.id===id);
    if(it){
      D.spend=D.spend.filter(x=>x.id!==id);
      D.settings.openingCash=r2((+D.settings.openingCash||0)+(+it.amount||0));
      if(it.debtId){
        const d=D.debts.find(x=>x.id===it.debtId);
        if(d) d.balance=(+d.balance||0)+(+it.amount||0);
      }
      save(); render();
    }
    return;
  }
  if(e.target.closest("[data-bkcopy]")){
    tap();
    const t=document.getElementById("bkText");
    if(t){ t.select(); t.setSelectionRange(0,999999);
      try{ navigator.clipboard.writeText(t.value); }catch(err){ try{ document.execCommand("copy"); }catch(e2){} }
      alert("Copied. Paste it somewhere safe.");
    }
    return;
  }
  if(e.target.closest("[data-backup]")){ tap(); backup(); return; }
  if(e.target.closest("[data-restore]")){ tap();
    const f=document.getElementById("restoreFile"); if(f) f.click(); return; }
  if(e.target.closest("[data-update]")){
    tap();
    if("serviceWorker" in navigator){
      navigator.serviceWorker.getRegistration()
        .then(r=>r&&r.update()).catch(()=>{})
        .then(()=>setTimeout(()=>location.reload(),600));
    } else location.reload();
    return;
  }
  if(e.target.id==="bd"){ closeSheet(); return; }
  if(e.target.closest("[data-clear]")){ tap();
    if(confirm("Wipe every income, bill, debt and spending entry on this phone?")){
      D=blank(); save(); render(true);
    }
    return; }
});
document.addEventListener("change",e=>{
  if(e.target.dataset.rate!==undefined){
    if(!D.settings.fx) D.settings.fx={};
    D.settings.fx[activeCur()]=Number(e.target.value)||0;
    save(); render(); return;
  }
  if(e.target.id==="restoreFile"){
    const f=e.target.files&&e.target.files[0];
    if(f) restore(f);
    return;
  }
  const s=e.target.closest("[data-set]");
  if(s){ const k=s.dataset.set;
    D.settings[k] = s.tagName==="SELECT" ? (k==="weekStart"?Number(s.value):s.value)
      : (k==="weeks" ? Math.max(1,Math.min(104,Number(s.value)||12)) : (Number(s.value)||0));
    if(k==="openingCash") D.settings.cashUpdated=toISO(new Date());
    if(k==="cur") D.settings.cur=s.value;
    if(k==="parkAmount") D.settings.parkMode="manual";
    save(); render(); }
});
document.addEventListener("toggle",e=>{
  if(e.target.id==="setupBox"){ D.open.setup=e.target.open; save(); }
},true);

if(navigator.storage && navigator.storage.persist){
  navigator.storage.persist().catch(()=>{});
}
if("serviceWorker" in navigator && location.protocol==="https:"){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
boot();
</script>
